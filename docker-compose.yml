services:
  api:
    build:
      context: ./backend
    container_name: freshcart-api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-freshcart}
      POSTGRES_USER: ${POSTGRES_USER:-freshcart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required and must not be empty}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: freshcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freshcart}
      POSTGRES_USER: ${POSTGRES_USER:-freshcart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required and must not be empty}
    ports:
      - "5432:5432"
    volumes:
      - freshcart_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freshcart} -d ${POSTGRES_DB:-freshcart}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  freshcart_postgres_data:
